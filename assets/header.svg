<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="260" viewBox="0 0 1200 260" role="img" aria-label="Edmon Alcoceba Carbón · Estudiante de Ingeniería Informática">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#1e1b4b" />
      <stop offset="0.55" stop-color="#4338ca" />
      <stop offset="1" stop-color="#7c3aed" />
    </linearGradient>
    <linearGradient id="bar" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#c4b5fd" stop-opacity="0" />
      <stop offset="0.5" stop-color="#ffffff" />
      <stop offset="1" stop-color="#c4b5fd" stop-opacity="0" />
    </linearGradient>
    <radialGradient id="glow" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#a78bfa" stop-opacity="0.55" />
      <stop offset="1" stop-color="#a78bfa" stop-opacity="0" />
    </radialGradient>
    <clipPath id="frame">
      <rect width="1200" height="260" rx="22" />
    </clipPath>
  </defs>
  <style>
    .wave { animation: drift linear infinite; }
    .w1 { animation-duration: 16s; }
    .w2 { animation-duration: 11s; animation-direction: reverse; }
    .w3 { animation-duration: 7s; }
    @keyframes drift { from { transform: translateX(0); } to { transform: translateX(-1200px); } }

    .orb { animation: float 9s ease-in-out infinite; }
    .orb2 { animation-duration: 12s; animation-delay: -4s; }
    @keyframes float { 0%, 100% { transform: translate(0, 0); } 50% { transform: translate(60px, 18px); } }

    .dot { fill: #ede9fe; opacity: 0; animation: rise linear infinite; }
    @keyframes rise {
      0% { transform: translateY(0); opacity: 0; }
      15% { opacity: 0.85; }
      100% { transform: translateY(-230px); opacity: 0; }
    }

    .title, .sub { font-family: 'Segoe UI', Inter, system-ui, -apple-system, Helvetica, Arial, sans-serif; fill: #ffffff; text-anchor: middle; opacity: 0; }
    .title { font-size: 54px; font-weight: 700; letter-spacing: 0.5px; animation: up 0.9s 0.2s ease-out forwards; }
    .sub { font-size: 20px; font-weight: 500; letter-spacing: 3px; fill: #ddd6fe; animation: up 0.9s 0.7s ease-out forwards; }
    @keyframes up { from { opacity: 0; transform: translateY(16px); } to { opacity: 1; transform: translateY(0); } }

    .bar { transform-box: fill-box; transform-origin: center; transform: scaleX(0); animation: grow 1.1s 1.1s cubic-bezier(.2, .8, .2, 1) forwards; }
    @keyframes grow { to { transform: scaleX(1); } }
  </style>

  <g clip-path="url(#frame)">
    <rect width="1200" height="260" fill="url(#bg)" />

    <circle class="orb" cx="230" cy="70" r="170" fill="url(#glow)" />
    <circle class="orb orb2" cx="980" cy="200" r="200" fill="url(#glow)" />

    <path class="wave w1" fill="#ffffff" fill-opacity="0.06" d="M0 190 Q150 160 300 190 T600 190 T900 190 T1200 190 T1500 190 T1800 190 T2100 190 T2400 190 V260 H0 Z" />
    <path class="wave w2" fill="#ffffff" fill-opacity="0.07" d="M0 212 Q200 182 400 212 T800 212 T1200 212 T1600 212 T2000 212 T2400 212 V260 H0 Z" />
    <path class="wave w3" fill="#ffffff" fill-opacity="0.08" d="M0 232 Q100 216 200 232 T400 232 T600 232 T800 232 T1000 232 T1200 232 T1400 232 T1600 232 T1800 232 T2000 232 T2200 232 T2400 232 V260 H0 Z" />

    <circle class="dot" cx="90" cy="260" r="2.5" style="animation-duration: 7s; animation-delay: 0s" />
    <circle class="dot" cx="210" cy="260" r="1.8" style="animation-duration: 9s; animation-delay: -3s" />
    <circle class="dot" cx="340" cy="260" r="2.2" style="animation-duration: 6s; animation-delay: -1s" />
    <circle class="dot" cx="470" cy="260" r="1.6" style="animation-duration: 8s; animation-delay: -5s" />
    <circle class="dot" cx="610" cy="260" r="2.4" style="animation-duration: 10s; animation-delay: -2s" />
    <circle class="dot" cx="740" cy="260" r="1.8" style="animation-duration: 7s; animation-delay: -4s" />
    <circle class="dot" cx="860" cy="260" r="2.2" style="animation-duration: 9s; animation-delay: -6s" />
    <circle class="dot" cx="990" cy="260" r="1.6" style="animation-duration: 6s; animation-delay: -2.5s" />
    <circle class="dot" cx="1110" cy="260" r="2.4" style="animation-duration: 8s; animation-delay: -1.5s" />

    <text class="title" x="600" y="118">Edmon Alcoceba Carbón</text>
    <text class="sub" x="600" y="160">ESTUDIANTE DE INGENIERÍA INFORMÁTICA</text>
    <rect class="bar" x="440" y="178" width="320" height="3" rx="1.5" fill="url(#bar)" />
  </g>
</svg>
