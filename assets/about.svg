<svg xmlns="http://www.w3.org/2000/svg" width="900" height="311" viewBox="0 0 900 311" role="img" aria-label="Sobre mí: Grado en Ingeniería Informática, Universitat de Lleida, 3.º curso">
  <defs>
    <linearGradient id="card" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#16132f" />
      <stop offset="1" stop-color="#221c52" />
    </linearGradient>
    <linearGradient id="edge" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#7c3aed" stop-opacity="0" />
      <stop offset="0.5" stop-color="#c4b5fd" />
      <stop offset="1" stop-color="#7c3aed" stop-opacity="0" />
    </linearGradient>
  </defs>
  <style>
    .label { font: 600 12px 'Segoe UI', Inter, system-ui, -apple-system, Helvetica, Arial, sans-serif; letter-spacing: 3px; fill: #a78bfa; }
    .sweep { animation: sweep 6s ease-in-out infinite; }
    @keyframes sweep { 0% { transform: translateX(-900px); } 60%, 100% { transform: translateX(900px); } }
    .in { animation: in .6s ease-out both; }
    @keyframes in { from { opacity: 0; transform: translateY(8px); } to { opacity: 1; transform: translateY(0); } }
    .code { font: 15px 'SF Mono', Menlo, Consolas, 'Liberation Mono', monospace; }
    .ln { font: 13px 'SF Mono', Menlo, Consolas, 'Liberation Mono', monospace; fill: #5b5689; }
    .cursor { opacity: 0; animation: blink 1s steps(1) 2.06s infinite; }
    @keyframes blink { 0% { opacity: 1; } 50% { opacity: 0; } }
  </style>
  <rect x="1" y="1" width="898" height="309" rx="18" fill="url(#card)" stroke="#4c1d95" stroke-opacity=".7" />
  <rect class="sweep" x="0" y="1" width="900" height="1.5" fill="url(#edge)" />
  <circle cx="34" cy="34" r="6" fill="#f87171" /><circle cx="54" cy="34" r="6" fill="#fbbf24" /><circle cx="74" cy="34" r="6" fill="#34d399" />
  <text x="104" y="39" style="font: 13px 'SF Mono', Menlo, Consolas, 'Liberation Mono', monospace; fill: #8b87b8">sobre-mi.ts</text>
  <text class="label" x="866" y="38" text-anchor="end">SOBRE MÍ</text>
  <line x1="20" y1="58" x2="880" y2="58" stroke="#4c1d95" stroke-opacity=".6" />
  <g class="in" style="animation-delay: 0.30s"><text x="34" y="92" class="ln">1</text><text x="70" y="92" class="code" xml:space="preserve"><tspan fill="#c084fc">const </tspan><tspan fill="#f0abfc">edmon</tspan><tspan fill="#a5a3c9"> = {</tspan></text></g>
  <g class="in" style="animation-delay: 0.52s"><text x="34" y="119" class="ln">2</text><text x="70" y="119" class="code" xml:space="preserve">  <tspan fill="#93c5fd">estudios</tspan><tspan fill="#a5a3c9">: </tspan><tspan fill="#fde68a">"Grado en Ingeniería Informática"</tspan><tspan fill="#a5a3c9">,</tspan></text></g>
  <g class="in" style="animation-delay: 0.74s"><text x="34" y="146" class="ln">3</text><text x="70" y="146" class="code" xml:space="preserve">  <tspan fill="#93c5fd">universidad</tspan><tspan fill="#a5a3c9">: </tspan><tspan fill="#fde68a">"Universitat de Lleida"</tspan><tspan fill="#a5a3c9">, </tspan><tspan fill="#93c5fd">curso</tspan><tspan fill="#a5a3c9">: </tspan><tspan fill="#fde68a">"3.º"</tspan><tspan fill="#a5a3c9">,</tspan></text></g>
  <g class="in" style="animation-delay: 0.96s"><text x="34" y="173" class="ln">4</text><text x="70" y="173" class="code" xml:space="preserve">  <tspan fill="#93c5fd">base</tspan><tspan fill="#a5a3c9">: </tspan><tspan fill="#fde68a">"Barcelona, Catalunya"</tspan><tspan fill="#a5a3c9">,</tspan></text></g>
  <g class="in" style="animation-delay: 1.18s"><text x="34" y="200" class="ln">5</text><text x="70" y="200" class="code" xml:space="preserve">  <tspan fill="#93c5fd">intereses</tspan><tspan fill="#a5a3c9">: </tspan><tspan fill="#a5a3c9">[</tspan><tspan fill="#fde68a">"IA"</tspan><tspan fill="#a5a3c9">, </tspan><tspan fill="#fde68a">"Software"</tspan><tspan fill="#a5a3c9">, </tspan><tspan fill="#fde68a">"Web"</tspan><tspan fill="#a5a3c9">]</tspan><tspan fill="#a5a3c9">,</tspan></text></g>
  <g class="in" style="animation-delay: 1.40s"><text x="34" y="227" class="ln">6</text><text x="70" y="227" class="code" xml:space="preserve">  <tspan fill="#93c5fd">objetivo</tspan><tspan fill="#a5a3c9">: </tspan><tspan fill="#fde68a">"Prácticas en el sector IT"</tspan><tspan fill="#a5a3c9">,</tspan></text></g>
  <g class="in" style="animation-delay: 1.62s"><text x="34" y="254" class="ln">7</text><text x="70" y="254" class="code" xml:space="preserve">  <tspan fill="#93c5fd">idiomas</tspan><tspan fill="#a5a3c9">: </tspan><tspan fill="#a5a3c9">{ </tspan><tspan fill="#93c5fd">ca</tspan><tspan fill="#a5a3c9">: </tspan><tspan fill="#fde68a">"nativo"</tspan><tspan fill="#a5a3c9">, </tspan><tspan fill="#93c5fd">es</tspan><tspan fill="#a5a3c9">: </tspan><tspan fill="#fde68a">"nativo"</tspan><tspan fill="#a5a3c9">, </tspan><tspan fill="#93c5fd">en</tspan><tspan fill="#a5a3c9">: </tspan><tspan fill="#fde68a">"B2"</tspan><tspan fill="#a5a3c9">, </tspan><tspan fill="#93c5fd">de</tspan><tspan fill="#a5a3c9">: </tspan><tspan fill="#fde68a">"básico"</tspan><tspan fill="#a5a3c9"> }</tspan><tspan fill="#a5a3c9">,</tspan></text></g>
  <g class="in" style="animation-delay: 1.84s"><text x="34" y="281" class="ln">8</text><text x="70" y="281" class="code" xml:space="preserve"><tspan fill="#a5a3c9">};</tspan></text></g>
  <rect class="cursor" x="92" y="266" width="9" height="19" fill="#c4b5fd" />
</svg>
