    <circle class="star" cx="205" cy="35" r="1.6" style="animation-delay: -2.0s" /><circle class="star" cx="77" cy="60" r="1.2" style="animation-delay: -1.1s" /><circle class="star" cx="69" cy="58" r="1.2" style="animation-delay: -0.1s" /><circle class="star" cx="262" cy="52" r="1.2" style="animation-delay: -0.7s" /><circle class="star" cx="322" cy="53" r="1.2" style="animation-delay: -2.5s" /><circle class="star" cx="103" cy="40" r="2" style="animation-delay: -1.9s" /><circle class="star" cx="71" cy="62" r="2" style="animation-delay: -1.2s" /><circle class="star" cx="153" cy="28" r="2" style="animation-delay: -2.6s" /><circle class="star" cx="188" cy="52" r="1.2" style="animation-delay: -1.6s" /><circle class="star" cx="332" cy="45" r="2" style="animation-delay: -2.4s" /><circle class="star" cx="132" cy="32" r="2" style="animation-delay: -1.7s" /><circle class="star" cx="136" cy="49" r="1.2" style="animation-delay: -1.6s" /><circle class="star" cx="72" cy="62" r="1.2" style="animation-delay: -1.9s" /><circle class="star" cx="294" cy="60" r="1.6" style="animation-delay: -2.3s" />
    <circle class="moon" cx="358" cy="52" r="15" fill="#ede9fe" />
