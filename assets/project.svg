<svg xmlns="http://www.w3.org/2000/svg" width="900" height="270" viewBox="0 0 900 270" role="img" aria-label="Proyecto destacado: Montserrat Viva, mi TDR de bachillerato convertido en web">
  <defs>
    <linearGradient id="card" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#16132f" />
      <stop offset="1" stop-color="#221c52" />
    </linearGradient>
    <linearGradient id="edge" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#7c3aed" stop-opacity="0" />
      <stop offset="0.5" stop-color="#c4b5fd" />
      <stop offset="1" stop-color="#7c3aed" stop-opacity="0" />
    </linearGradient>
  </defs>
  <style>
    .label { font: 600 12px 'Segoe UI', Inter, system-ui, -apple-system, Helvetica, Arial, sans-serif; letter-spacing: 3px; fill: #a78bfa; }
    .sweep { animation: sweep 6s ease-in-out infinite; }
    @keyframes sweep { 0% { transform: translateX(-900px); } 60%, 100% { transform: translateX(900px); } }
    .in { animation: in .6s ease-out both; }
    @keyframes in { from { opacity: 0; transform: translateY(8px); } to { opacity: 1; transform: translateY(0); } }
    .draw { stroke-dasharray: 3200; animation: draw 2.6s .2s ease-in-out both; }
    @keyframes draw { from { stroke-dashoffset: 3200; } to { stroke-dashoffset: 0; } }
    .fill { animation: fade 1.2s 1.6s ease-out both; }
    .back { animation: fade 1.6s .1s ease-out both; }
    @keyframes fade { from { opacity: 0; } to { opacity: 1; } }
    .moon { animation: fade 1.5s .4s both, glow 4s 2s ease-in-out infinite; }
    @keyframes glow { 0%, 100% { filter: drop-shadow(0 0 4px #c4b5fd); } 50% { filter: drop-shadow(0 0 14px #a78bfa); } }
    .star { fill: #ede9fe; animation: twinkle 3s ease-in-out infinite; }
    @keyframes twinkle { 0%, 100% { opacity: .15; } 50% { opacity: .95; } }
    .arrow { animation: nudge 1.6s ease-in-out infinite; }
    @keyframes nudge { 0%, 100% { transform: translateX(0); } 50% { transform: translateX(6px); } }
  </style>
  <rect x="1" y="1" width="898" height="268" rx="18" fill="url(#card)" stroke="#4c1d95" stroke-opacity=".7" />
  <rect class="sweep" x="0" y="1" width="900" height="1.5" fill="url(#edge)" />
  <defs>
    <linearGradient id="rock" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#a78bfa" stop-opacity=".5" />
      <stop offset="1" stop-color="#7c3aed" stop-opacity="0" />
    </linearGradient>
    <clipPath id="clip"><rect x="1" y="1" width="898" height="268" rx="18" /></clipPath>
  </defs>
