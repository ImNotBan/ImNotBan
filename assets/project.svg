  <g class="in" style="animation-delay: 1.7s"><text x="430" y="232" style="font: 500 14px 'SF Mono', Menlo, Consolas, 'Liberation Mono', monospace; fill: #a78bfa">montserrat-viva.vercel.app</text><text class="arrow" x="642" y="232" style="font: 600 16px 'Segoe UI', Inter, system-ui, -apple-system, Helvetica, Arial, sans-serif; fill: #c4b5fd">→</text></g>
