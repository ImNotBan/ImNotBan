  <text class="in" x="430" y="116" style="animation-delay: .7s; font: 700 36px 'Segoe UI', Inter, system-ui, -apple-system, Helvetica, Arial, sans-serif; fill: #ffffff">Montserrat Viva</text>
  <text class="in" x="430" y="148" style="animation-delay: .9s; font: 16px 'Segoe UI', Inter, system-ui, -apple-system, Helvetica, Arial, sans-serif; fill: #b8b4e0">Mi TDR de bachillerato convertido en web.</text>
