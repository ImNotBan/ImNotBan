    <text x="335" y="112" style="font: 500 15px 'Segoe UI', Inter, system-ui, -apple-system, Helvetica, Arial, sans-serif; fill: #ece9ff">C++</text>
  </g>
  <g class="chip" style="animation-delay: 0.56s">
