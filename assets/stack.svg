    <circle class="pulse" cx="680" cy="107" r="5" fill="#e34c26" style="animation-delay: 2.10s" />
    <text x="693" y="112" style="font: 500 15px 'Segoe UI', Inter, system-ui, -apple-system, Helvetica, Arial, sans-serif; fill: #ece9ff">HTML</text>
  </g>
  <g class="chip" style="animation-delay: 0.83s">
    <rect x="757" y="90" width="74" height="34" rx="17" fill="#2a2366" stroke="#a78bfa" stroke-opacity=".55" />
    <circle class="pulse" cx="775" cy="107" r="5" fill="#a78bfa" style="animation-delay: 2.45s" />
    <text x="788" y="112" style="font: 500 15px 'Segoe UI', Inter, system-ui, -apple-system, Helvetica, Arial, sans-serif; fill: #ece9ff">CSS</text>
  </g>
  <text x="34" y="156" style="font: 600 11px 'Segoe UI', Inter, system-ui, -apple-system, Helvetica, Arial, sans-serif; letter-spacing: 2px; fill: #6d6a9c">HERRAMIENTAS</text>
  <g class="chip" style="animation-delay: 0.92s">
    <rect x="34" y="168" width="83" height="34" rx="17" fill="#2a2366" stroke="#89e051" stroke-opacity=".55" />
    <circle class="pulse" cx="52" cy="185" r="5" fill="#89e051" style="animation-delay: 2.80s" />
    <text x="65" y="190" style="font: 500 15px 'Segoe UI', Inter, system-ui, -apple-system, Helvetica, Arial, sans-serif; fill: #ece9ff">Bash</text>
  </g>
  <g class="chip" style="animation-delay: 1.01s">
    <rect x="127" y="168" width="70" height="34" rx="17" fill="#2a2366" stroke="#f05032" stroke-opacity=".55" />
    <circle class="pulse" cx="145" cy="185" r="5" fill="#f05032" style="animation-delay: 3.15s" />
    <text x="158" y="190" style="font: 500 15px 'Segoe UI', Inter, system-ui, -apple-system, Helvetica, Arial, sans-serif; fill: #ece9ff">Git</text>
  </g>
  <g class="chip" style="animation-delay: 1.10s">
    <rect x="207" y="168" width="89" height="34" rx="17" fill="#2a2366" stroke="#fcc624" stroke-opacity=".55" />
    <circle class="pulse" cx="225" cy="185" r="5" fill="#fcc624" style="animation-delay: 3.50s" />
    <text x="238" y="190" style="font: 500 15px 'Segoe UI', Inter, system-ui, -apple-system, Helvetica, Arial, sans-serif; fill: #ece9ff">Linux</text>
