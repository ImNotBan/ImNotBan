    <circle class="pulse" cx="535" cy="107" r="5" fill="#3178c6" style="animation-delay: 1.75s" />
    <text x="548" y="112" style="font: 500 15px 'Segoe UI', Inter, system-ui, -apple-system, Helvetica, Arial, sans-serif; fill: #ece9ff">TypeScript</text>
  </g>
  <g class="chip" style="animation-delay: 0.74s">
