    <text x="270" y="112" style="font: 500 15px 'Segoe UI', Inter, system-ui, -apple-system, Helvetica, Arial, sans-serif; fill: #ece9ff">C</text>
  </g>
  <g class="chip" style="animation-delay: 0.47s">
    <rect x="304" y="90" width="74" height="34" rx="17" fill="#2a2366" stroke="#f34b7d" stroke-opacity=".55" />
