    <circle class="pulse" cx="406" cy="107" r="5" fill="#d4a373" style="animation-delay: 1.40s" />
    <text x="419" y="112" style="font: 500 15px 'Segoe UI', Inter, system-ui, -apple-system, Helvetica, Arial, sans-serif; fill: #ece9ff">Assembly</text>
  </g>
  <g class="chip" style="animation-delay: 0.65s">
