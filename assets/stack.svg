<svg xmlns="http://www.w3.org/2000/svg" width="900" height="224" viewBox="0 0 900 224" role="img" aria-label="Tecnologías: Java, Python, C, C++, Assembly, TypeScript, HTML, CSS, Bash, Git, Linux">
  <defs>
    <linearGradient id="card" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#16132f" />
      <stop offset="1" stop-color="#221c52" />
    </linearGradient>
    <linearGradient id="edge" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#7c3aed" stop-opacity="0" />
      <stop offset="0.5" stop-color="#c4b5fd" />
      <stop offset="1" stop-color="#7c3aed" stop-opacity="0" />
    </linearGradient>
  </defs>
  <style>
    .label { font: 600 12px 'Segoe UI', Inter, system-ui, -apple-system, Helvetica, Arial, sans-serif; letter-spacing: 3px; fill: #a78bfa; }
    .sweep { animation: sweep 6s ease-in-out infinite; }
    @keyframes sweep { 0% { transform: translateX(-900px); } 60%, 100% { transform: translateX(900px); } }
    .in { animation: in .6s ease-out both; }
    @keyframes in { from { opacity: 0; transform: translateY(8px); } to { opacity: 1; transform: translateY(0); } }
    .chip { transform-box: fill-box; transform-origin: center; animation: pop .5s cubic-bezier(.3, 1.6, .5, 1) both; }
    @keyframes pop { from { opacity: 0; transform: scale(.6); } to { opacity: 1; transform: scale(1); } }
    .pulse { transform-box: fill-box; transform-origin: center; animation: pulse 2.4s ease-in-out infinite; }
    @keyframes pulse { 0%, 100% { transform: scale(1); opacity: 1; } 50% { transform: scale(1.45); opacity: .6; } }
  </style>
  <rect x="1" y="1" width="898" height="222" rx="18" fill="url(#card)" stroke="#4c1d95" stroke-opacity=".7" />
  <rect class="sweep" x="0" y="1" width="900" height="1.5" fill="url(#edge)" />
  <text class="label" x="34" y="44">TECNOLOGÍAS</text>
  <text x="34" y="78" style="font: 600 11px 'Segoe UI', Inter, system-ui, -apple-system, Helvetica, Arial, sans-serif; letter-spacing: 2px; fill: #6d6a9c">LENGUAJES</text>
  <g class="chip" style="animation-delay: 0.20s">
    <rect x="34" y="90" width="83" height="34" rx="17" fill="#2a2366" stroke="#e76f00" stroke-opacity=".55" />
    <circle class="pulse" cx="52" cy="107" r="5" fill="#e76f00" style="animation-delay: 0.00s" />
    <text x="65" y="112" style="font: 500 15px 'Segoe UI', Inter, system-ui, -apple-system, Helvetica, Arial, sans-serif; fill: #ece9ff">Java</text>
  </g>
  <g class="chip" style="animation-delay: 0.29s">
    <rect x="127" y="90" width="102" height="34" rx="17" fill="#2a2366" stroke="#4b8bbe" stroke-opacity=".55" />
    <circle class="pulse" cx="145" cy="107" r="5" fill="#4b8bbe" style="animation-delay: 0.35s" />
    <text x="158" y="112" style="font: 500 15px 'Segoe UI', Inter, system-ui, -apple-system, Helvetica, Arial, sans-serif; fill: #ece9ff">Python</text>
  </g>
  <g class="chip" style="animation-delay: 0.38s">
    <rect x="239" y="90" width="55" height="34" rx="17" fill="#2a2366" stroke="#a8b9cc" stroke-opacity=".55" />
